name: Build Suite AppImage

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            binutils coreutils desktop-file-utils fakeroot \
            libgdk-pixbuf2.0-dev patchelf squashfs-tools strace \
            util-linux zsync python3-pip python3-setuptools

          python3 -m pip install --upgrade pip
          pip3 install appimage-builder
          # appimage-builder's Debian-version parsing breaks on newer
          # `packaging` releases (they dropped LegacyVersion support).
          pip3 install "packaging<22"

          # Download continuous appimagetool release
          wget "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage" -O /tmp/appimagetool
          chmod +x /tmp/appimagetool
          sudo mv /tmp/appimagetool /usr/local/bin/appimagetool

      - name: Build AppImage
        run: |
          chmod +x build_appimage.sh
          ./build_appimage.sh

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CHD_Processing_Suite-x86_64.AppImage
          path: '*.AppImage'

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download built AppImage
        uses: actions/download-artifact@v4
        with:
          name: CHD_Processing_Suite-x86_64.AppImage

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.AppImage
            install.sh
          generate_release_notes: true
