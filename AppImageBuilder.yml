version: 1

AppDir:
  path: ./AppDir
  app_info:
    id: com.user.chdsuite
    name: CHD Processing Suite
    icon: utilities-terminal
    version: 1.0.0
    exec: usr/bin/python3
    exec_args: "${APPDIR}/usr/src/main_launcher.py $@"

  apt:
    arch: amd64
    sources:
      - sourceline: 'deb [arch=amd64] http://archive.ubuntu.com/ubuntu/ jammy main universe'
        key_url: 'http://keyserver.ubuntu.com/pks/lookup?op=get&search=0x871920D1991BC93C'
      - sourceline: 'deb [arch=amd64] http://archive.ubuntu.com/ubuntu/ jammy-updates main universe'
        key_url: 'http://keyserver.ubuntu.com/pks/lookup?op=get&search=0x871920D1991BC93C'
    include:
      - python3
      - python3-tk
      - mame-tools
      - ffmpeg
    exclude: []

  runtime:
    env:
      PATH: '${APPDIR}/usr/bin:${PATH}'
      TCL_LIBRARY: '${APPDIR}/usr/share/tcltk/tcl8.6'
      TK_LIBRARY: '${APPDIR}/usr/share/tcltk/tk8.6'

AppImage:
  arch: x86_64
